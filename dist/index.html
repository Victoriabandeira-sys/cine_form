<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Form</title>
    <link rel="stylesheet" href="./css/styles.css">

</head>
<body class="bg-black text-white font-body p-8">
    <main class="w-full max-w-7xl min-h-dvh bg-white/5 rounded-3xl p-6 mx-auto border border-white/15">
        <header class="flex flex-col items-center justify-between gap-4 lg:flex-row">
            
            <h1 class="font-title text-red text-4xl font-bold leading-tight md:text-5xl">Cine Form</h1>

            <figure class="flex gap-3">
                <img src="./img/usuário1.jpg" alt="Usuário1" class="size-10 border-2 bg-card object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./img/usuário2.jpg" alt="Usuário2" class="size-10 border-2 bg-card object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./img/usuário3.jpg" alt="Usuário3" class="size-10 border-2 bg-card object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./img/usuário4.jpg" alt="Usuário4" class="size-10 border-2 bg-card object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./img/usuário5.jpg" alt="Usuário5" class="size-10 border-2 bg-card object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./img/usuário6.jpg" alt="Usuário6" class="size-10 border-2 bg-card object-cover cursor-pointer hover:animate-spin duration-500">
            </figure>
        </header>

        <form name="form-cine" id="form-cine" method="get" action="">
            <p class="my-5 font-medium text-gray text-center text-balance lg:text-left font-title"> O que faz você dar play?</p>

            <fieldset class="w-full border border-white/10 rounded-2xl bg-white/10 p-6 mb-6">
                <legend class="font-body text-lg font-bold  text-red-title px-2">01. Sobre você</legend>

                <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <div>
                        <label for="nome" class=" block ml-2 text-sm mb-2 text-gray ">Nome completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required minlength="10" maxlength="30" class="border border-white/10 bg-card px-2 py-3 w-full rounded-lg outline-none focus:border-white focus:bg-white/10 transition">
                    </div>

                    <div>
                        <label for="idade" class=" block ml-2 text-sm mb-2 text-gray">Idade</label>
                        <input type="number" id="idade" name="idade" placeholder="Digite sua idade" required minlength="10" maxlength="120" class="border border-white/10 bg-card px-2 py-3 w-full rounded-lg outline-none focus:border-white focus:bg-white/10 transition">
                    </div>

                    <div>
                        <label for="email" class=" block ml-2 text-sm mb-2 text-gray">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite sei E-mail" required  maxlength="50" class="border border-white/10 bg-card px-2 py-3 w-full rounded-lg outline-none focus:border-white focus:bg-white/10 transition">
                    </div>

                    <div>
                        <label for="profissao" class=" block ml-2 text-sm mb-2 text-gray">Idade</label>
                        <input type="text" id="profissao" name="profissao" placeholder="Digite sua Profissão" required minlength="10" maxlength="50" class="border border-white/10 bg-card px-2 py-3 w-full rounded-lg outline-none focus:border-white focus:bg-white/10 transition">
                    </div>

                </section>
            </fieldset>

            <fieldset class="w-full border border-white/10 rounded-2xl bg-white/10 p-6 mb-6">

                <legend class="font-body text-lg font-bold  text-red-title px-2">02. Suas Preferências</legend>

                <section class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <div>
                            <label for="preferencia" class="block ml-2 text-sm mb-2 text-gray">Suas Preferências</label>

                            <select name="preferencia" id="preferencia" required
                                class="border border-white/10 bg-card px-2 py-3 w-full rounded-lg outline-none focus:border-white">
                                <option value="" disabled selected>Selecione sua preferência</option>
                                <option value="filmes">Filmes</option>
                                <option value="series">Séries</option>
                                <option value="ambos">Ambos</option>
                            </select>
                        </div>

                        <div>
                            <label for="genero" class="block ml-2 text-sm mb-2 text-gray">Gênero favorito</label>

                            <select name="genero" id="genero" required
                                class="border border-white/10 bg-card px-2 py-3 w-full rounded-lg outline-none focus:border-white">
                                <option value="" disabled selected>Selecione um gênero</option>
                                <option value="terror">Terror</option>
                                <option value="romance">Romance</option>
                                <option value="comedia">Comédia</option>
                                <option value="acao">Ação</option>
                            </select>
                        </div>

                        <div class="md:col-span-2">
                            <label for="mensagem" class="block ml-2 text-sm mb-2 text-gray">Conte-nos sobre seus filmes e séries favoritos</label>

                            <textarea
                                name="mensagem"
                                id="mensagem"
                                rows="5"
                                class="w-full border resize-none h-20 border-white/10 rounded-lg bg-card p-3
                                outline-none focus:border-white focus:bg-white/10 transition"
                                placeholder="Escreva aqui..."></textarea>
                        </div>
                </section>
            </fieldset>

            <fieldset class="border border-white/10 rounded-2xl bg-white/10 p-4">

                <legend class="font-body text-lg font-bold  text-red-title px-2">03. Seus hábitos</legend>

                <section class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <div>
                            <p class="block ml-2 mt-2 text-sm mb-2 text-slate-300">Quantas vezes assiste por semana?</p>
                            <section class="grid gap-6 lg:grid-cols-2"></section>

                            <select name="preferencia" id="preferencia" required
                                class="border border-white/10 bg-card px-3 py-3 w-full rounded-lg outline-none focus:border-white ">
                                <option value="" disabled selected>Selecione sua preferência</option>
                                <option value="1">1 vez por semana</option>
                                <option value="2,3">2 a 3 vezes por semana</option>
                                <option value="outros">Outros</option>
                            </select>
                        </div>

                        <div>
                            <p class="block text-sm ml-2 my-2 text-slate-300">Prefere assistir:</p>
                            <sectio class="grid gap-6 lg:grid-cols-3">

                        <label class="flex bg-card items-center gap-6 border border-white/10 rounded-lg p-4 hover:bg-white/10 transition">
                            <input type="radio" name="assistir" id="assistir1" value="sozinho" class="size-4 accent-red">
                            <span>Sozinho/ar</span>
                        </label>

                        <label class="flex bg-card items-center gap-6 border border-white/10 rounded-lg p-4 hover:bg-white/10 transition">
                            <input type="radio" name="assistir" id="assistir2" value="aconpanhado" class="size-4 accent-red">
                            <span>Acompanhado</span>
                        </label>

                        <label class="flex bg-card items-center gap-6 border border-white/10 rounded-lg p-4 hover:bg-white/10 transition">
                            <input type="radio" name="assistir" id="assistir3" value="osdois" class="size-4 accent-red">
                            <span>Os dois</span>
                        </label>
                    </sectio>
                </div>

                <div>
                    <p class="block text-sm ml-2 my-2 text-slate-300">O que mais importa?</p>
                    <section class="grid gap-6 lg:grid-cols-3">
                
                        <label class="flex bg-card items-center gap-6 border border-white/10 rounded-lg p-4 hover:bg-white/10 transition">
                            <input type="checkbox" name="importancia" id="importancia1" value="historia" class="size-4 accent-red">
                            <span>História</span>
                        </label>
                
                        <label class="flex bg-card items-center gap-6 border border-white/10 rounded-lg p-4 hover:bg-white/10 transition">
                            <input type="checkbox" name="importancia" id="importancia2" value="elenco" class="size-4 accent-red">
                            <span>Elenco</span>
                        </label>
                
                        <label class="flex bg-card items-center gap-6 border border-white/10 rounded-lg p-4 hover:bg-white/10 transition">
                            <input type="checkbox" name="importancia" id="importancia3" value="trilhasonora" class="size-4 accent-red">
                            <span>Trilha sonora</span>
                        </label>

                    </section>
                </div>

                        <div>
                            <label for="mensagem" class="block ml-2 text-sm mb-2 text-gray">Adicione outros elementos que julgar importante:</label>

                            <textarea
                                name="mensagem"
                                id="mensagem"
                                rows="5"
                                class="w-full border resize-none h-20 border-white/10 rounded-lg bg-card p-3
                                outline-none focus:border-white focus:bg-white/10 transition"
                                placeholder="Escreva aqui..."></textarea>
                        </div>
                </section>
            </fieldset>

            <fieldset class="w-full border border-white/10 rounded-2xl bg-white/10 p-6 mb-6">

                <legend class="font-body text-lg font-bold  text-red-title px-2">04. Sua opinião</legend>

                <section class="grid grid-cols-1 gap-6">

                    <div>
                        <p class="block text-sm ml-2 my-2 text-slate-300">Nota para sua experiência</p>
                        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                    
                            <label class="bg-card flex items-center gap-3 gap-6 border border-white/10 rounded-lg p-4 hover:bg-white/10 cursor-pointer transition">
                                <input type="radio" name="nota" id="nota1" value="1" class="size-4 accent-red">
                                <span>1 - péssima</span>
                            </label>
                    
                            <label class="bg-card flex items-center gap-3 gap-6 border border-white/10 rounded-lg p-4 hover:bg-white/10 cursor-pointer transition">
                                <input type="radio" name="nota" id="nota2" value="2" class="size-4 accent-red">
                                <span>2 - ruim</span>
                            </label>
                    
                            <label class="bg-card flex items-center gap-3 gap-6 border border-white/10 rounded-lg p-4 hover:bg-white/10 cursor-pointer transition">
                                <input type="radio" name="nota" id="nota3" value="3" class="size-4 accent-red">
                                <span>3 - bom</span>
                            </label>

                            <label class="bg-card flex items-center gap-3 gap-6 border border-white/10 rounded-lg p-4 hover:bg-white/10 cursor-pointer transition">
                                <input type="radio" name="nota" id="nota4" value="4" class="size-4 accent-red">
                                <span>4 - ótimo</span>
                            </label>

                            <label class="bg-card flex items-center gap-3 gap-6 border border-white/10 rounded-lg p-4 hover:bg-white/10 cursor-pointer transition">
                                <input type="radio" name="nota" id="nota5" value="5" class="size-4 accent-red">
                                <span>5 - excelente</span>
                            </label>
                        </section>
                    </div>

                    <label class="flex items-center gap-6">
                        <input type="checkbox" name="termos" id="termos" value="termos" class="size-4 ">
                        <span class="text-sm text-white/60">Concordo com os termos do forms e autorizo o processamento dos meus dados</span>
                    </label>

                    <div class="my-4">
                    <button type="button" id="btn-enviar" class="w-full bg-red px-4 py-5 rounded-lg font-bold text-slate-950 cursor-pointer transition hover:scale-97 duration-700">Enviar</button>
                </div>
                </section>
            
            </fieldset>

        </form>
    </main>
</body>
</html>
